[package]
name = "t3d"
version = "0.2.1"
description = "T3D — modern code editor (Tauri)"
authors = ["Tomlin7 <billydevbusiness@gmail.com>"]
edition = "2021"

[lib]
name = "t3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
